<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <title>{% block title %}基督教世界新闻{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.cn">
  <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
  <link href="https://fonts.googleapis.cn/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ root }}assets/css/style.css?v=20261102a">
<script data-palette-init>(function(){try{var n=localStorage.getItem('news-palette');if(n&&n.length){document.documentElement.setAttribute('data-palette',n);}}catch(e){}})();</script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="{{ root }}index.html" class="logo">
        <span class="logo-mark">✝</span>
        <span class="logo-text">基督教<em>世界新闻</em></span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="菜单" aria-expanded="false">☰</button>
      <nav class="main-nav" id="mainNav">
        <a href="{{ root }}index.html">首页</a>
        <a href="{{ root }}categories/news.html">资讯</a>
        <a href="{{ root }}categories/persecution.html">逼迫</a>
        <a href="{{ root }}categories/mission.html">宣教</a>
        <a href="{{ root }}categories/church.html">教会</a>
        <a href="{{ root }}categories/theology.html">神学</a>
        <a href="{{ root }}categories/heresy.html">异端</a>
        <a href="{{ root }}categories/culture.html">文化</a>
        <a href="{{ root }}categories/wiki.html">百科</a>
        <a href="{{ root }}sources.html">信息源</a>
      </nav>
    <div class="palette-picker"><button class="palette-dot" type="button" data-palette="monet" title="莫奈" aria-label="莫奈配色" aria-pressed="false"></button><button class="palette-dot" type="button" data-palette="matisse" title="马蒂斯" aria-label="马蒂斯配色" aria-pressed="false"></button><button class="palette-dot" type="button" data-palette="morandi" title="莫兰迪" aria-label="莫兰迪配色" aria-pressed="false"></button><button class="palette-dot" type="button" data-palette="macaron" title="马卡龙" aria-label="马卡龙配色" aria-pressed="false"></button><button class="palette-dot" type="button" data-palette="rococo" title="洛可可" aria-label="洛可可配色" aria-pressed="false"></button><button class="palette-dot" type="button" data-palette="vangogh" title="梵高·星夜" aria-label="梵高·星夜配色" aria-pressed="false"></button><button class="palette-dot" type="button" data-palette="hokusai" title="北斋·普鲁士蓝" aria-label="北斋·普鲁士蓝配色" aria-pressed="false"></button></div>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>基督教世界新闻 · 每日自动采集全球基督教资讯源 · 共 {{ total }} 条资料</p>
      <p class="disclaimer">本站为静态聚合示例，新闻条目版权归原始来源所有；内容仅供学习参考，请以官方来源为准。</p>
    </div>
  </footer>
  <script src="{{ root }}assets/js/main.js?v=20261102a"></script>
</body>
</html>
