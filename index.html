<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>基督教世界新闻 · Christian News</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cn-topbar">
  <div class="cn-brand">🕊 基督教世界新闻</div>

<header class="hero">

</footer>

<nav class="cn-tabbar">
  <button class="cn-tab active" data-tab="home"><span class="ico">📰</span><span class="lbl">首页</span></button>
  <button class="cn-tab" data-tab="region"><span class="ico">🌍</span><span class="lbl">地区</span></button>
  <button class="cn-tab" data-tab="topic"><span class="ico">🏷</span><span class="lbl">主题</span></button>
