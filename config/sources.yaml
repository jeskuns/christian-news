# 基督教世界新闻知识库信息源配置
# category 取值: news, persecution, mission, church, theology, culture, wiki, heresy
# parser 取值: rss, generic, wikipedia, news_search
#
# 说明：
#   - 机构官网 HTML 结构各异、且多家存在 SSL/403 问题，统一改用关键词新闻检索（news_search）
#     在 GitHub Actions 运行，Google News 可达；不可达时自动切换 GDELT 兜底。
#   - 真实 RSS 源优先用 rss 解析器；被反爬时改 news_search 同样可工作。
#   - 已覆盖：国际/中文新闻机构、逼迫监测、宣教机构、各宗派（改革宗/浸信会/路德会/
#     卫理公会/圣公会/天主教/东正教/长老会/灵恩）、神学期刊（含生命季刊等学术性期刊）、
#     文化媒体、异端辨析、百科背景。
# 可按需启用/禁用、添加新源或调整查询词。

