# 基督教世界新闻知识库信息源配置
# category 取值: news, persecution, mission, church, theology, culture, wiki
# parser 取值: rss, generic, wikipedia, news_search
#
# 说明：
#   - 机构官网 HTML 结构各异、且多家存在 SSL/403 问题，统一改用关键词新闻检索（news_search）
#     在 GitHub Actions 运行，Google News 可达；不可达时自动切换 GDELT 兜底。
#   - 真实 RSS 源优先用 rss 解析器；被反爬时改 news_search 同样可工作。
# 可按需启用/禁用、添加新源或调整查询词。

sources:
  # ==================== 基督教世界资讯（国际） ====================
  - name: Christianity Today
    url: https://www.christianitytoday.com/news/rss/
    category: news
    parser: rss
    language: en
    country: US
    max_items: 20

  - name: Premier Christian News
    url: https://premierchristian.news/rss
    category: news
    parser: rss
    language: en
    country: GB
    max_items: 15

  - name: Evangelical Focus
    url: https://evangelicalfocus.com/rss
    category: news
    parser: rss
    language: en
    country: ES
    max_items: 15

  - name: World News (Christian)
    url: https://news.google.com/rss/search
    category: news
    parser: news_search
    language: en
    country: US
    max_items: 15
    extra:
      provider: google
      query: "Christian news world"

  - name: 福音时报
    url: https://news.google.com/rss/search
    category: news
    parser: news_search
    language: zh
    country: CN
    max_items: 12
    extra:
      provider: google
      query: "福音时报 基督教"

  - name: 基督日报
    url: https://news.google.com/rss/search
    category: news
    parser: news_search
    language: zh
    country: CN
    max_items: 12
    extra:
      provider: google
      query: "基督日报 基督教"

