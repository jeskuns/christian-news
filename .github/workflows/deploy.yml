name: Daily Collect & Deploy

# 每天 UTC 20:00 = 北京时间次日 04:00 自动采集、生成并发布到 Cloudflare Pages
# （GitHub 的 schedule 触发本身可能延迟数小时，以实际运行时间为准）
"on":
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect sources and build site
        id: collect
        run: python run.py full --workers 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 确保 Pages 项目存在（首次部署时创建；已存在则忽略）
      - name: Ensure Pages project exists
        run: npx --yes wrangler@latest pages project create "christian-news" --production-branch=master || echo "project exists (ok)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy site --project-name="christian-news" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 提交刷新后的站点与翻译缓存：保留历史，同时让计划任务不因仓库长期无提交而被自动停用
      # 采集/生成失败时不提交，避免把半生成的 site 推上线（Pages 部署步骤同样会被跳过）
      - name: Commit refreshed content
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name "ChristianNews Bot"
          git config user.email "bot@users.noreply.github.com"
          git add site data
          if git diff --cached --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "chore: daily auto update $(date -u +%Y-%m-%d)"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin master && git push origin master; then
                pushed=true
                break
              fi
              echo "回推被拒（第 ${attempt} 次），5 秒后重试…"
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::刷新内容未能推回仓库（站点已部署成功，仅仓库数据未更新）"
              exit 1
            fi
          fi
