name: Daily Collect & Deploy

# 每天 UTC 00:00 = 北京时间 08:00 自动采集、生成并发布到 Cloudflare Pages
"on":
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect sources and build site
        run: python run.py full --workers 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 确保 Pages 项目存在（首次部署时创建；已存在则忽略）
      - name: Ensure Pages project exists
        run: npx --yes wrangler@latest pages project create "christian-news" --production-branch=master || echo "project exists (ok)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy site --project-name="christian-news" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 提交刷新后的站点与翻译缓存：保留历史，同时让计划任务不因仓库长期无提交而被自动停用
      - name: Commit refreshed content
        if: always()
        run: |
          git config user.name "ChristianNews Bot"
          git config user.email "bot@users.noreply.github.com"
          git add site data
          if git diff --cached --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "chore: daily auto update $(date -u +%Y-%m-%d)"
            git push
          fi
